[package]
name = "openagent-network-core"
version = "0.1.0"
edition = "2021"
description = "High-performance cryptographic identity verification, wire message authentication, and capability registry for decentralized agent networking"
license = "Apache-2.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }

[lib]
crate-type = ["cdylib", "rlib"]
