[package]
name = "openagent-graph-core"
version = "0.1.0"
edition = "2021"
description = "High-performance adjacency graph indexing, BFS/DFS traversal with cycle limits, and knowledge graph persistence"
license = "Apache-2.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lib]
crate-type = ["cdylib", "rlib"]
