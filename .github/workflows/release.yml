name: Automated Release & Verification

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"

jobs:
  build-and-package:
    name: Build & Release Verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Node.js 22.x
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify release commit matches tag
        run: |
          TAG_COMMIT=$(git rev-parse ${{ github.ref_name }}^{commit})
          HEAD_COMMIT=$(git rev-parse HEAD)
          echo "Tag Commit:  $TAG_COMMIT"
          echo "HEAD Commit: $HEAD_COMMIT"
          if [ "$TAG_COMMIT" != "$HEAD_COMMIT" ]; then
            echo "Error: Tag does not point to current HEAD"
            exit 1
          fi

      - name: Mandatory release gates validation
        run: |
          npm run format:check
          npm run build
          npm run typecheck
          npm run test
          npm run test:security
          npm run benchmark

      - name: Package Linux desktop distribution
        run: npm run package:desktop

      - name: Generate CycloneDX & SPDX SBOMs with VCS metadata
        run: npm run sbom -- --source-commit "${{ github.sha }}" --tag "${{ github.ref_name }}" --strict

      - name: Prepare release distribution directory & SHA256 checksums
        run: |
          mkdir -p release-dist
          cp apps/desktop/release/openagent-desktop-linux-x64.tar.gz release-dist/
          cp apps/desktop/release/openagent-desktop-linux-x64.tar.gz.sha256 release-dist/
          cp sbom.cyclonedx.json release-dist/
          cp sbom.spdx.json release-dist/
          cd release-dist
          sha256sum openagent-desktop-linux-x64.tar.gz sbom.cyclonedx.json sbom.spdx.json > SHA256SUMS
          sha256sum -c SHA256SUMS
          cd ..

      - name: Upload build artifacts
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: openagent-release-${{ github.ref_name }}
          path: release-dist/

  provenance-and-release:
    name: Sign, Attest & Publish Release
    needs: build-and-package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download release artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: openagent-release-${{ github.ref_name }}
          path: release-dist

      - name: Generate SLSA build provenance attestation
        uses: actions/attest-build-provenance@c074443f1aeeab763a9f8b4d82b407b1c3c393bc # v2.2.3
        with:
          subject-path: "release-dist/openagent-desktop-linux-x64.tar.gz"

      - name: Install Cosign for keyless signing
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0

      - name: Sign candidate release archive
        run: |
          cosign sign-blob --yes \
            --bundle "release-dist/openagent-desktop-linux-x64.tar.gz.bundle" \
            "release-dist/openagent-desktop-linux-x64.tar.gz"

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_OPTS=()
          if [[ "${{ github.ref_name }}" == *"-rc"* || "${{ github.ref_name }}" == *"-alpha"* || "${{ github.ref_name }}" == *"-beta"* ]]; then
            RELEASE_OPTS+=("--prerelease")
          fi

          NOTES_FILE=""
          if [ -f "docs/releases/${{ github.ref_name }}-release-notes.md" ]; then
            NOTES_FILE="--notes-file docs/releases/${{ github.ref_name }}-release-notes.md"
          elif [ -f "docs/releases/v0.1.0-release-notes.md" ]; then
            NOTES_FILE="--notes-file docs/releases/v0.1.0-release-notes.md"
          else
            NOTES_FILE="--generate-notes"
          fi

          gh release create "${{ github.ref_name }}" \
            release-dist/* \
            --title "OpenAgent Infrastructure ${{ github.ref_name }}" \
            $NOTES_FILE \
            "${RELEASE_OPTS[@]}"
